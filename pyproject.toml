[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "audio-quality-pipeline"
version = "0.1.0"
description = "A cost-aware, auditable quality-control pipeline for audio at scale."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Your Organization" }]
keywords = ["audio", "speech", "tts", "quality-control", "data-engineering"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
vad = ["silero-vad>=6.2"]
asr = ["faster-whisper>=1.2"]
dnsmos = ["torchmetrics>=1.8", "onnxruntime>=1.23", "librosa>=0.11", "requests>=2.32"]
speaker = ["speechbrain>=1.0", "torch>=2.2", "torchaudio>=2.2"]

[project.scripts]
audio-quality-pipeline = "audio_quality_pipeline.cli:main"
audio-quality-metrics = "audio_quality_pipeline.metric_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
